<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIN highlighter</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div><span class="brand">SIN<span class="dot">.</span></span><p>Find familiar names, anywhere.</p></div><label class="switch"><input id="enabled" type="checkbox" aria-label="Enable highlighting"><span></span></label></header>
<main>
<section class="summary"><strong id="status">Loading…</strong><small id="detail" aria-live="polite"></small></section>
<label class="names"><input id="includeNames" type="checkbox"> Entertainer list <span id="nameCount"></span></label>
<section><h1>Your rules <span id="ruleCount">0</span></h1><div id="rules"></div><p id="empty">Add a name, phrase, or pattern to make it yours.</p></section>
<form id="ruleForm"><h2 id="formTitle">Add a rule</h2><label for="value">Keyword or expression</label><input id="value" required maxlength="500" placeholder="e.g. Angela White" autocomplete="off">
<label for="mode">Match type</label><select id="mode"><option value="exact">Exact word / phrase</option><option value="contains">Contains</option><option value="starts">Starts with</option><option value="ends">Ends with</option><option value="regex">Regular expression</option></select>
<p id="hint"></p><label class="case"><input id="caseSensitive" type="checkbox"> Case sensitive</label>
<div class="actions"><button id="save" type="submit">Add rule</button><button id="cancel" type="button" hidden>Cancel</button></div><p id="error" role="alert"></p></form>
</main><footer>Private by design. Rules stay in this browser.</footer><script type="module" src="popup.js"></script>
</body></html>
